services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: way_education_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d way_education_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
